<!DOCTYPE html>
<html>

<script id="vertex-shader" type="x-shader/x-vertex">
#version 300 es

in  vec4 aPosition;
in vec4 vColor;
out vec4 fColor;
uniform mat4 uModelViewMatrix;
uniform mat4 uProjectionMatrix;

void main()
{
    gl_Position = uProjectionMatrix*uModelViewMatrix*aPosition;
    fColor = vColor;

}
</script>

<script id="fragment-shader" type="x-shader/x-fragment">
#version 300 es

precision mediump float;
in vec4 fColor;
out vec4 fragColor;

void
main()
{
    fragColor = fColor;
}
</script>

<script type="text/javascript" src="../mountain_files/initShaders.js"></script>
<script type="text/javascript" src="../mountain_files/MVnew.js"></script>
<script type="text/javascript" src="../mountain_files/Richie_Dix_mountain.js"></script>

</body>
</html>
